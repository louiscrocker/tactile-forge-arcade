<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8f0"/>
      <stop offset=".55" stop-color="#3f9ab8"/>
      <stop offset="1" stop-color="#143a4a"/>
    </linearGradient>
    <radialGradient id="pad" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#8fd75f"/>
      <stop offset="1" stop-color="#2f7a3a"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec95a"/>
      <stop offset="1" stop-color="#3f7a2a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- water line -->
  <path d="M0 300 Q64 288 128 300 T256 300 T384 300 T512 300 V512 H0 Z" fill="#1f6f80" opacity=".8"/>
  <path d="M0 300 Q64 288 128 300 T256 300 T384 300 T512 300" stroke="#e8fbff" stroke-width="6" fill="none" opacity=".8"/>
  <!-- lily pad -->
  <g transform="translate(256 320)">
    <path d="M-150 0 A150 52 0 1 1 150 0 L 40 -20 Z" fill="url(#pad)"/>
    <ellipse cx="0" cy="0" rx="150" ry="52" fill="none" stroke="#2f6a22" stroke-width="5" opacity=".7"/>
  </g>
  <!-- frog -->
  <g transform="translate(256 250)">
    <!-- far hind leg -->
    <path d="M-70 40 Q-140 10 -110 70 Q-80 90 -30 82" fill="none" stroke="#3f7a2a" stroke-width="26" stroke-linecap="round"/>
    <!-- body -->
    <path d="M-110 30 C-120 -40 -60 -80 0 -78 C60 -80 120 -40 110 30 C100 70 40 84 0 82 C-40 84 -100 70 -110 30 Z" fill="url(#body)" stroke="#2f5a22" stroke-width="6"/>
    <ellipse cx="0" cy="60" rx="80" ry="22" fill="#e9f0c8" opacity=".85"/>
    <!-- near hind leg -->
    <path d="M70 40 Q150 10 120 74 Q90 96 30 86" fill="none" stroke="#5f9a3a" stroke-width="26" stroke-linecap="round"/>
    <path d="M70 40 Q150 10 120 74 Q90 96 30 86" fill="none" stroke="#2f5a22" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    <!-- front legs -->
    <path d="M-40 60 L-50 96 M40 60 L50 96" stroke="#5f9a3a" stroke-width="16" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="-48" cy="-70" r="34" fill="#5f9a3a" stroke="#2f5a22" stroke-width="5"/>
    <circle cx="48" cy="-70" r="34" fill="#5f9a3a" stroke="#2f5a22" stroke-width="5"/>
    <circle cx="-48" cy="-70" r="22" fill="#e8b93a"/>
    <circle cx="48" cy="-70" r="22" fill="#e8b93a"/>
    <ellipse cx="-46" cy="-70" rx="9" ry="16" fill="#111"/>
    <ellipse cx="50" cy="-70" rx="9" ry="16" fill="#111"/>
    <circle cx="-54" cy="-78" r="6" fill="#fff"/>
    <circle cx="42" cy="-78" r="6" fill="#fff"/>
    <!-- smile -->
    <path d="M-70 10 Q0 50 70 10" fill="none" stroke="#2f5a22" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
