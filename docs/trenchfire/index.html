<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactile Forge — Trenchfire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23000604%22/%3E%3Cpath d=%22M8 52 L26 20 L38 20 L56 52 M20 52 L32 30 L44 52%22 fill=%22none%22 stroke=%22%2300d878%22 stroke-width=%224%22/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000604; color: #00d878; font: 14px ui-monospace, monospace; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; letter-spacing: .3em; }
</style>
</head>
<body>
<div id="boot">LOADING VECTOR CABINET…</div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  // Streaming needs the server to send application/wasm; fall back to a plain
  // download for hosts that don't.
  const load = () => WebAssembly.instantiateStreaming(fetch("trenchfire.wasm"), go.importObject)
    .catch(() => fetch("trenchfire.wasm")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
      .then(b => WebAssembly.instantiate(b, go.importObject)));
  load()
    .then(r => { document.getElementById("boot").remove(); go.run(r.instance); })
    .catch(e => { document.getElementById("boot").textContent = "FAILED TO LOAD: " + e; console.error("trenchfire: failed to load", e); });
</script>
</body>
</html>
