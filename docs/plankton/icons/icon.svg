<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ad0d8"/>
      <stop offset=".5" stop-color="#1e7ab0"/>
      <stop offset="1" stop-color="#0a2e58"/>
    </linearGradient>
    <radialGradient id="glass" cx=".45" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#f6dccb" stop-opacity=".75"/>
      <stop offset="1" stop-color="#e0a890" stop-opacity=".95"/>
    </radialGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f0a040"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sea)"/>
  <g fill="#cfe9a0" opacity=".85">
    <circle cx="80" cy="96" r="12"/><circle cx="420" cy="420" r="14"/><circle cx="440" cy="110" r="9"/><circle cx="96" cy="410" r="10"/><circle cx="380" cy="64" r="7"/>
  </g>
  <g transform="translate(282 262) scale(14.5)">
    <!-- far feeler -->
    <path d="M9.4 -2.6 Q1 -9.2 -12 -9.1" fill="none" stroke="#e0a890" stroke-width=".35" stroke-linecap="round"/>
    <!-- tail and bristles -->
    <path d="M-5.2 -1 L-14.2 -.6 L-14.2 .6 L-5.2 1.3 Z" fill="#f2d8c8" fill-opacity=".8" stroke="#e0a890" stroke-width=".2"/>
    <g stroke="#f6e4d8" stroke-width=".14" stroke-linecap="round"><path d="M-14.2 -.4 L-18.6 -1.6"/><path d="M-14.2 -.15 L-19 -.6"/><path d="M-14.2 .15 L-19 .5"/><path d="M-14.2 .4 L-18.6 1.6"/></g>
    <ellipse cx="-14" cy="0" rx=".7" ry=".5" fill="#d8322a"/>
    <!-- swimming legs -->
    <g stroke="#e0a890" stroke-width=".35" stroke-linecap="round"><path d="M5.6 2.4 L3.9 5.5"/><path d="M3.7 2.4 L2 5.6"/><path d="M1.8 2.4 L.1 5.6"/><path d="M-.1 2.4 L-1.8 5.5"/><path d="M-2 2.4 L-3.7 5.3"/></g>
    <!-- body -->
    <path d="M11 -.4 C11.2 -2.6 9.4 -3.6 7 -3.6 L-2.6 -3.3 C-5 -3.1 -6 -1.6 -6 0 C-6 1.6 -4.6 2.5 -2.6 2.6 L6.4 2.6 C9.4 2.5 10.9 1.4 11 -.4 Z" fill="url(#glass)" stroke="#d89880" stroke-width=".22"/>
    <path d="M8.6 .3 Q2 1.1 -6 .4" fill="none" stroke="#7aa040" stroke-opacity=".75" stroke-width=".9" stroke-linecap="round"/>
    <ellipse cx="1" cy="-1.2" rx="5" ry="1.4" fill="url(#oil)"/>
    <ellipse cx=".6" cy="-1.9" rx="2.6" ry=".3" fill="#fffbe8" fill-opacity=".7"/>
    <ellipse cx="8.6" cy="1.6" rx="1.3" ry=".6" fill="#d8322a" fill-opacity=".6"/>
    <circle cx="10" cy="-.6" r=".7" fill="#c01010"/>
    <circle cx="9.8" cy="-.85" r=".22" fill="#ffffff"/>
    <!-- near feeler -->
    <path d="M9.4 -2.6 Q1 -10.6 -13 -10.6" fill="none" stroke="#d89880" stroke-width=".45" stroke-linecap="round"/>
    <circle cx="-13" cy="-10.6" r=".5" fill="#d8322a"/>
  </g>
</svg>
