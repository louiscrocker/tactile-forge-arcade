<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9ae0"/>
      <stop offset=".7" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#ffd2a0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a857c"/>
      <stop offset=".5" stop-color="#b8b2a6"/>
      <stop offset="1" stop-color="#8a857c"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="400" cy="120" r="44" fill="#fff5c0"/>
    <path d="M0 400 Q130 340 256 380 T512 370 L512 512 L0 512 Z" fill="#5aa03a"/>
    <!-- moat -->
    <path d="M0 440 Q256 420 512 440 L512 512 L0 512 Z" fill="#3a78b8"/>
    <!-- wall -->
    <rect x="96" y="250" width="320" height="170" fill="url(#stone)"/>
    <g fill="#9e9a92">
      <rect x="96" y="232" width="34" height="26"/><rect x="164" y="232" width="34" height="26"/><rect x="232" y="232" width="34" height="26"/><rect x="300" y="232" width="34" height="26"/><rect x="368" y="232" width="34" height="26"/>
    </g>
    <!-- towers -->
    <rect x="56" y="160" width="80" height="260" fill="#a8a39a"/>
    <rect x="376" y="160" width="80" height="260" fill="#a8a39a"/>
    <path d="M44 166 L96 70 L148 166 Z" fill="#4a5a80"/>
    <path d="M364 166 L416 70 L468 166 Z" fill="#4a5a80"/>
    <!-- keep -->
    <rect x="200" y="140" width="112" height="120" fill="#b8b2a6"/>
    <path d="M190 146 L256 60 L322 146 Z" fill="#a8402e"/>
    <rect x="252" y="20" width="4" height="50" fill="#6a655c"/>
    <path d="M256 22 L300 34 L256 46 Z" fill="#c03a3a"/>
    <!-- gate -->
    <path d="M226 420 L226 340 A30 30 0 0 1 286 340 L286 420 Z" fill="#2a2016"/>
    <g stroke="#6a655c" stroke-width="4"><path d="M240 340 V420 M256 330 V420 M272 340 V420 M226 370 H286 M226 395 H286"/></g>
    <!-- drawbridge -->
    <path d="M226 420 L286 420 L300 450 L212 450 Z" fill="#7a4e2a"/>
    <!-- windows -->
    <g fill="#ffd070"><rect x="84" y="220" width="22" height="30" rx="11"/><rect x="404" y="220" width="22" height="30" rx="11"/><rect x="244" y="180" width="24" height="34" rx="12"/><rect x="150" y="300" width="16" height="26" rx="8"/><rect x="346" y="300" width="16" height="26" rx="8"/></g>
    <!-- mortar lines -->
    <g stroke="rgba(0,0,0,.18)" stroke-width="2"><path d="M96 290 H416 M96 330 H416 M96 370 H416 M130 250 V290 M200 290 V330 M160 330 V370 M330 290 V330 M370 330 V370 M300 370 V420 M180 370 V420"/></g>
  </g>
</svg>
