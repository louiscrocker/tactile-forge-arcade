<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8c8"/>
      <stop offset=".55" stop-color="#1a6a98"/>
      <stop offset="1" stop-color="#0a2e48"/>
    </linearGradient>
    <radialGradient id="skin" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#d47a4a"/>
      <stop offset=".6" stop-color="#a8502c"/>
      <stop offset="1" stop-color="#5a2412"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b85a34"/>
      <stop offset="1" stop-color="#6a2a14"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sea)"/>
    <g fill="#ffffff" opacity=".12">
      <path d="M60 0 L120 0 L230 512 L170 512 Z"/><path d="M300 0 L340 0 L420 512 L380 512 Z"/>
    </g>
    <path d="M0 440 Q128 410 256 430 T512 424 L512 512 L0 512 Z" fill="#a8946a"/>
    <ellipse cx="80" cy="450" rx="48" ry="26" fill="#8a8274"/><ellipse cx="440" cy="446" rx="56" ry="30" fill="#7a7264"/>
  </g>
  <!-- eight arms curling out from under the head -->
  <g fill="none" stroke="url(#arm)" stroke-linecap="round">
    <path d="M200 300 C140 330 90 320 70 380 C60 410 90 430 110 410" stroke-width="30"/>
    <path d="M230 320 C210 370 170 400 130 440 C110 460 140 470 160 450" stroke-width="28"/>
    <path d="M260 326 C262 380 240 420 250 460 C256 480 290 480 290 455" stroke-width="30"/>
    <path d="M300 318 C330 360 370 390 400 430 C416 452 440 436 420 416" stroke-width="28"/>
    <path d="M316 296 C370 320 420 300 450 350 C462 372 436 392 420 372" stroke-width="30"/>
    <path d="M186 280 C130 270 100 240 70 262" stroke-width="22" opacity=".8"/>
    <path d="M330 272 C380 250 410 220 446 240" stroke-width="22" opacity=".8"/>
    <path d="M250 330 C236 400 190 430 200 470" stroke-width="20" opacity=".8"/>
  </g>
  <!-- suckers along the front arms -->
  <g fill="#f0d8b8" opacity=".9">
    <circle cx="150" cy="328" r="6"/><circle cx="118" cy="345" r="6"/><circle cx="92" cy="372" r="5"/><circle cx="84" cy="400" r="5"/>
    <circle cx="206" cy="372" r="6"/><circle cx="184" cy="402" r="6"/><circle cx="160" cy="428" r="5"/>
    <circle cx="262" cy="380" r="6"/><circle cx="252" cy="416" r="6"/><circle cx="256" cy="450" r="5"/>
    <circle cx="340" cy="372" r="6"/><circle cx="372" cy="400" r="6"/><circle cx="398" cy="428" r="5"/>
    <circle cx="380" cy="326" r="6"/><circle cx="416" cy="332" r="6"/><circle cx="442" cy="356" r="5"/>
  </g>
  <!-- the mantle and head -->
  <ellipse cx="256" cy="200" rx="120" ry="110" fill="url(#skin)" stroke="#4a1c0c" stroke-width="6"/>
  <ellipse cx="256" cy="292" rx="78" ry="42" fill="#a8502c" stroke="#4a1c0c" stroke-width="5"/>
  <ellipse cx="232" cy="130" rx="40" ry="18" fill="#ffffff" opacity=".22"/>
  <g fill="#5a2412" opacity=".55"><circle cx="190" cy="180" r="7"/><circle cx="310" cy="160" r="6"/><circle cx="280" cy="230" r="5"/><circle cx="210" cy="240" r="6"/><circle cx="340" cy="220" r="5"/></g>
  <!-- the eyes with bar pupils -->
  <g>
    <ellipse cx="208" cy="256" rx="30" ry="26" fill="#e8d8b0" stroke="#4a1c0c" stroke-width="4"/>
    <ellipse cx="304" cy="256" rx="30" ry="26" fill="#e8d8b0" stroke="#4a1c0c" stroke-width="4"/>
    <ellipse cx="208" cy="256" rx="22" ry="19" fill="#a8702c"/><ellipse cx="304" cy="256" rx="22" ry="19" fill="#a8702c"/>
    <rect x="190" y="250" width="36" height="11" rx="5" fill="#120c08"/><rect x="286" y="250" width="36" height="11" rx="5" fill="#120c08"/>
    <circle cx="198" cy="246" r="5" fill="#fff" opacity=".9"/><circle cx="294" cy="246" r="5" fill="#fff" opacity=".9"/>
  </g>
</svg>
