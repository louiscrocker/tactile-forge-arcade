  <path d="M150 140 C110 120 96 70 120 44 C134 30 150 40 146 60 C142 80 160 92 168 112 C186 104 178 64 196 58 C212 54 214 90 196 124 C184 146 166 150 150 140 Z" fill="url(#claw)" stroke="#1e2814" stroke-width="5"/>
  <path d="M368 138 C430 128 456 74 430 40 C414 22 392 30 392 54 C392 80 372 90 362 106 C344 98 352 60 330 54 C306 50 302 96 322 128 C334 146 352 148 368 138 Z" fill="url(#claw)" stroke="#1e2814" stroke-width="5"/>
  <!-- carapace and rostrum -->
  <path d="M256 130 L266 160 C300 168 306 220 300 262 C294 296 278 306 256 306 C234 306 218 296 212 262 C206 220 212 168 246 160 Z" fill="url(#shell)" stroke="#1e2814" stroke-width="6"/>
  <path d="M232 214 Q256 228 280 214" stroke="#1e2814" stroke-width="4" fill="none" opacity=".6"/>
  <g fill="#8a3a2a" opacity=".6"><circle cx="240" cy="190" r="4"/><circle cx="270" cy="250" r="5"/><circle cx="246" cy="276" r="4"/><circle cx="276" cy="196" r="3"/></g>
  <circle cx="240" cy="160" r="9" fill="#100c08"/><circle cx="272" cy="160" r="9" fill="#100c08"/>
  <circle cx="237" cy="157" r="3" fill="#fff"/><circle cx="269" cy="157" r="3" fill="#fff"/>
