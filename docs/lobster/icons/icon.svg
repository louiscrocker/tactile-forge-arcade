  <g fill="url(#shell)" stroke="#1e2814" stroke-width="5">
    <path d="M220 304 L292 304 L288 332 L224 332 Z"/><path d="M224 332 L288 332 L284 358 L228 358 Z"/><path d="M228 358 L284 358 L280 382 L232 382 Z"/><path d="M232 382 L280 382 L276 402 L236 402 Z"/>
