<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab8e0"/>
      <stop offset=".55" stop-color="#1a6aa8"/>
      <stop offset="1" stop-color="#0a2e58"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3a22"/>
      <stop offset=".45" stop-color="#6a7a4a"/>
      <stop offset="1" stop-color="#2a3a22"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a8a52"/>
      <stop offset="1" stop-color="#2e3a20"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sea)"/>
    <g fill="#ffffff" opacity=".12">
      <path d="M60 0 L120 0 L230 512 L170 512 Z"/><path d="M300 0 L340 0 L420 512 L380 512 Z"/>
    </g>
    <path d="M0 440 Q128 410 256 430 T512 424 L512 512 L0 512 Z" fill="#a8946a"/>
    <ellipse cx="80" cy="450" rx="48" ry="26" fill="#9a9284"/><ellipse cx="440" cy="446" rx="56" ry="30" fill="#8a8274"/>
  </g>
  <!-- antennae -->
  <g stroke="#c8a870" stroke-width="5" fill="none" stroke-linecap="round">
